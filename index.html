<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <!-- The two typefaces of the design; the families are named in src/theme.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&amp;display=swap"
      rel="stylesheet"
    />
    <title>Tidslinje</title>
    <script>
      // Light or dark as chosen on the start screen, set before the first paint (src/ui/theme.ts).
      try {
        const tema = localStorage.getItem('tidslinje:tema')
        if (tema === 'lys' || tema === 'mork') document.documentElement.dataset.tema = tema
      } catch (error) {
        // Blocked storage: the look follows the device.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
